[project]
name = "navi-mumbai-bmc-house-price-prediction"
version = "1.0.0"
description = "Navi Mumbai and BMC locality house price prediction"
requires-python = ">=3.13"
dependencies = [
  "fastapi==0.139.2",
  "joblib==1.5.3",
  "numpy==2.5.1",
  "pandas==3.0.3",
  "scikit-learn==1.9.0",
]

[tool.black]
line-length = 127
target-version = ['py310', 'py311', 'py312']

[tool.isort]
profile = "black"
line_length = 127

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
